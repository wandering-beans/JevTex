<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JevTex</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header><h1 class="brand">JevTex</h1><div class="header-controls"><span id="connection" class="pill" data-i18n="connecting"></span><label for="language" class="sr-only" data-i18n="language"></label><select id="language"></select></div></header>
  <main>
    <section class="upload" data-i18n-aria-label="upload"><label class="primary file-button" for="file" data-i18n="openFile"></label><input id="file" type="file" accept=".tex" class="sr-only"><div class="samples"><span data-i18n="samples"></span><button id="correct">correct</button><button id="mistake">mistake</button></div></section>
    <p id="notice" role="status" aria-live="polite" data-i18n="initial"></p>
    <div id="warnings" role="alert"></div>
    <div class="workspace">
      <section class="panel review-panel" aria-labelledby="review-title">
        <div class="panel-heading"><h2 id="review-title" data-i18n="pairs"></h2><span id="count" data-i18n="unloaded"></span></div>
        <div id="empty-review" class="empty"><p data-i18n="unloaded"></p></div>
        <div id="review" hidden>
          <label class="field-label" for="assumptions" data-i18n="assumptions"></label><textarea id="assumptions" rows="3" data-i18n-placeholder="assumptionsPlaceholder"></textarea>
          <p class="hint" data-i18n="pairHint"></p>
          <div id="pairs"></div>
          <button id="add-pair" class="secondary" data-i18n="addPair"></button>
          <div class="run"><button id="check" class="primary" data-i18n="check"></button><p id="key-help" class="hint"></p></div>
        </div>
      </section>
      <section class="panel pdf-panel" aria-labelledby="pdf-title">
        <div class="panel-heading"><h2 id="pdf-title" data-i18n="pdfPreview"></h2><div class="toolbar"><label><input type="checkbox" id="show-highlights" checked><span data-i18n="highlights"></span></label><label for="zoom" class="sr-only" data-i18n="zoom"></label><select id="zoom"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></div></div>
        <div class="pdf-caption"><span id="document-name" data-i18n="unloaded"></span><span id="summary"></span></div>
        <div id="pdf-pages"><div class="empty"><p data-i18n="unloaded"></p></div></div>
        <div id="downloads" hidden><a id="download-pdf" class="secondary" download data-i18n="downloadPdf"></a><a id="download-json" download data-i18n="downloadJson"></a></div>
      </section>
    </div>
    <footer><span data-i18n="footer"></span><span id="model"></span></footer>
  </main>
</body>
</html>
