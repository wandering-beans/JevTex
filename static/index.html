<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JevTex</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header><h1 class="brand">JevTex</h1><span id="connection" class="pill">接続を確認中</span></header>
  <main>
    <section class="upload" aria-label="文書の読み込み"><label class="primary file-button" for="file">TeXファイルを開く</label><input id="file" type="file" accept=".tex" class="sr-only"><div class="samples"><span>サンプル</span><button id="correct">correct</button><button id="mistake">mistake</button></div></section>
    <p id="notice" role="status" aria-live="polite">UTF-8のTeXファイルを選択してください（1MB以下）。判定時に選択した式と文脈をTypeSafeへ送信します。</p>
    <div id="warnings" role="alert"></div>
    <div class="workspace">
      <section class="panel review-panel" aria-labelledby="review-title">
        <div class="panel-heading"><h2 id="review-title">比較ペア</h2><span id="count">未読込</span></div>
        <div id="empty-review" class="empty"><p>未読込</p></div>
        <div id="review" hidden>
          <label class="field-label" for="assumptions">共通の前提条件</label><textarea id="assumptions" rows="3" placeholder="例：r > 0、fはC²級。必要な前提を確認・追記してください。"></textarea>
          <p class="hint">候補には別々の定義も含まれます。同じ量を変形するペアだけ残してください。参照式はペアごとに選べます。</p>
          <div id="pairs"></div>
          <button id="add-pair" class="secondary">＋ 比較ペアを追加</button>
          <div class="run"><button id="check" class="primary">Jevで判定する</button><p id="key-help" class="hint"></p></div>
        </div>
      </section>
      <section class="panel pdf-panel" aria-labelledby="pdf-title">
        <div class="panel-heading"><h2 id="pdf-title">PDFプレビュー</h2><div class="toolbar"><label><input type="checkbox" id="show-highlights" checked>ハイライト</label><label for="zoom" class="sr-only">PDF倍率</label><select id="zoom"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></div></div>
        <div class="pdf-caption"><span id="document-name">未読込</span><span id="summary"></span></div>
        <div id="pdf-pages"><div class="empty"><p>未読込</p></div></div>
        <div id="downloads" hidden><a id="download-pdf" class="secondary" download>注釈付きPDFを保存</a><a id="download-json" download>判定JSON</a></div>
      </section>
    </div>
    <footer>赤：誤り ／ 黄：判断保留。Jevの判定は数学的証明ではありません。<span id="model"></span></footer>
  </main>
</body>
</html>
